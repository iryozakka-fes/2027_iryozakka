/* =========================================================
   医療×ざっかふぇす 2027 ティザー
   カラーは Notion「世界観・トンマナ決定」(2026/09/01確定) に準拠
   ルール: ページ背景は単色。グラデはメインビジュアル（ざぶとん）限定
   ========================================================= */
:root{
  --bg:        #fbf4d0; /* 背景 パステルイエロー・単色 */
  --teal:      #36cac2; /* ロゴ青緑 固定 */
  --accent:    #ff7d6d; /* アクセント */
  --accent-sh: #e8655a; /* アクセントの影（ボタン立体用・派生色） */
  --ink:       #304e4c; /* フォント色 */
  --ink-soft:  #5c7a77; /* 補助文字（--ink の明度を上げた派生色） */
  --grad-l:    #9de5e0; /* ざぶとん左端 青緑パステル */
  --grad-c:    #fbf4d0; /* ざぶとん中間 = 背景色 */
  --grad-r:    #ffbdb5; /* ざぶとん右端 コーラルパステル */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic Medium","游ゴシック Medium",YuGothic,
              游ゴシック体,"ヒラギノ角ゴ Pro W3",メイリオ,sans-serif;
  font-weight:700;
  line-height:1.75;
}
img{max-width:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- 見出しバッジ ---------- */
.hero{padding:54px 0 0;text-align:center}
.badge{
  display:inline-block;margin:0;
  background:var(--accent);color:#fff;
  padding:9px 28px;border-radius:999px;
  font-size:15px;letter-spacing:.14em;
}

/* ---------- メインビジュアル（グラデざぶとん） ---------- */
.mv{
  position:relative;margin:26px 0 0;
  padding-bottom:clamp(30px,7vw,56px);
  /* ぴおすんの表示幅。ざぶとんの右余白はこの値から計算するので、
     ここを変えるだけでロゴとぴおすんが被らないまま大きさを調整できる */
  --pio:clamp(80px,17vw,172px);
}
.cushion{
  background:linear-gradient(100deg,var(--grad-l) 0%,var(--grad-c) 52%,var(--grad-r) 100%);
  border-radius:clamp(28px,5vw,48px);
  padding:clamp(30px,6vw,54px) clamp(22px,5vw,56px);
  padding-right:calc(var(--pio) + 10px); /* ぴおすんが立つぶんを空ける */
}
.cushion img{display:block;width:100%;height:auto}
.piosun{
  position:absolute;right:-6px;bottom:0;
  width:var(--pio);height:auto;
  filter:drop-shadow(0 6px 10px rgba(48,78,76,.16));
}

/* ---------- 開催概要 ---------- */
.lead{margin:26px 0 0;text-align:center;font-size:15px;color:var(--ink-soft);line-height:2}
/* 狭い画面では固定改行を外して自然に折り返させる */
@media (max-width:560px){.br-pc{display:none}}
.date{
  margin:30px 0 0;text-align:center;color:var(--accent);
  font-size:clamp(27px,6.2vw,44px);line-height:1.35;
}
.time{margin:4px 0 0;text-align:center;font-size:15px;color:var(--ink-soft)}
.venue{margin:24px 0 0;text-align:center;font-size:clamp(18px,3.8vw,26px);line-height:1.5}
.venue small{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}

/* ---------- ボタン ---------- */
.actions{margin:38px 0 0;text-align:center}
.btn{
  display:block;width:100%;max-width:380px;margin:0 auto 14px;
  padding:16px 22px;border-radius:999px;
  background:var(--accent);color:#fff;text-decoration:none;
  font-size:17px;
  box-shadow:0 4px 0 var(--accent-sh);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:hover,.btn:focus-visible{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-sh)}
.btn.ghost{background:#fff;color:var(--accent);box-shadow:0 4px 0 var(--grad-l)}
.btn.ghost:hover,.btn.ghost:focus-visible{box-shadow:0 2px 0 var(--grad-l)}

/* ---------- これから決まること ---------- */
.next{
  max-width:460px;margin:40px auto 0;
  background:#fff;border-radius:24px;padding:26px 30px;
  text-align:left; /* .actions の中央寄せを引き継がせない */
}
.next h2{margin:0 0 10px;font-size:16px;letter-spacing:.08em;color:var(--accent);text-align:center}
.next ul{margin:0;padding-left:1.15em;font-size:15px;line-height:2.1}
.next li::marker{color:var(--teal)}

/* ---------- フッター ---------- */
footer{margin-top:60px;padding:34px 20px 48px;text-align:center;font-size:13px;color:var(--ink-soft)}
.sns{display:flex;gap:14px;justify-content:center;margin:0 0 20px;padding:0;list-style:none}
.sns a{
  width:48px;height:48px;border-radius:50%;
  background:#fff;color:var(--accent);
  display:grid;place-items:center;text-decoration:none;
}
.sns svg{width:20px;height:20px;fill:currentColor}
footer p{margin:4px 0}
footer a.txt{color:var(--accent)}
</style>
