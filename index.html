<!-- 日付の丸ゴシックは M PLUS Rounded 1c。えのもとさん指定の Rounded M+ 2p は
     Google Fonts に無いため、同じM+系でCDN配信されているこちらを使用。
     厳密に 2p にしたい場合はフォントファイルを自前ホストして @font-face で差し替える -->
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   医療×ざっかふぇす 2027 ティザー
   カラーは Notion「世界観・トンマナ決定」(2026/09/01確定) に準拠
   ルール: ページ背景は単色。グラデはメインビジュアル（ざぶとん）限定
   角丸は2026サイトの実測スケールに合わせる: ラベル4px / 小ボタン8px / 主ボタン16px
   ========================================================= */
:root{
  --bg:        #fbf4d0; /* 背景 パステルイエロー・単色 */
  --teal:      #36cac2; /* ロゴ青緑 固定 */
  --accent:    #ff7d6d; /* アクセント */
  --accent-sh: #e8655a; /* アクセントの影（hover用・派生色） */
  --ink:       #304e4c; /* フォント色 */
  --ink-soft:  #5c7a77; /* 補助文字（--ink の明度を上げた派生色） */
  --grad-l:    #9de5e0; /* ざぶとん左端 青緑パステル */
  --grad-c:    #fbf4d0; /* ざぶとん中間 = 背景色 */
  --grad-r:    #ffbdb5; /* ざぶとん右端 コーラルパステル */
  --gutter:    clamp(40px,6vw,72px); /* ざぶとんの上下に残す余白 */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* 画面外へ切ったマーガレットで横スクロールが出ないように。
   花を回転させると外接矩形が広がってさらに外へ出るため、body だけでは
   足りず html にも要る */
html,body{overflow-x:hidden}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic Medium","游ゴシック Medium",YuGothic,
              游ゴシック体,"ヒラギノ角ゴ Pro W3",メイリオ,sans-serif;
  font-weight:700;
  line-height:1.75;
}
img{max-width:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}


/* ---------- アイコンの帯 ----------
   ページの一番上と一番下に敷いて、全体を上下から挟む。
   ざぶとんの中を静かに保ったまま賑やかさだけを足す役目。
   並び順は医療と雑貨を交互（注射器→ノート→目薬→マグ→絆創膏→鉛筆→クリップ）。
   ロゴ内の「医」「ざ」と「×（絆創膏の交差）」は、すぐ下の大きなロゴと
   重複するため帯には入れない。

   個々の img を並べるとアイコンが点在するだけで帯にならないため、
   7点を1枚に合成した strip.png を横方向にリピートさせている。
   画面幅がいくつでも途切れず、密度も出る。
   アイコンを差し替えるときは strip.png を作り直す（合成スクリプトは
   sharp で height=120px・間隔26px・両端は半分の13pxとして繋ぎ目を揃えている）。 */
.iconband{
  height:clamp(42px,5.4vw,68px);
  background:url("img/icon/strip.png") repeat-x center center;
  background-size:auto 100%;
}
.iconband--top{margin:calc(var(--gutter) * .7) 0}
.iconband--bottom{margin:calc(var(--gutter) * .6) 0 calc(var(--gutter) * .7)}

/* ---------- グラデのざぶとん ----------
   ヘッダー・フッター以外＝コンテンツ全部がこの上に乗る。
   .wrap の860px制限の外に出して、画面幅の88%まで広げている。 */
.mv{
  position:relative;
  width:min(88vw,1240px);
  /* 人だかりは絶対配置でレイアウト高さに入らないため、はみ出す量ぶんを下に確保する */
  margin:0 auto var(--hang);
  /* 下端に並ぶ面々の高さ。ざぶとんの下余白をこの値から計算するので、
     ここを変えるだけで中身と被らないまま大きさを調整できる */
  /* ぴおすんと人物の大きさの差が、そのまま画の主役・脇役の差になる。
     2026のメインビジュアルでも人物はかなり小さく数多く置かれている */
  --pio-h:clamp(160px,20vw,310px);  /* ぴおすん（主役・大きく） */
  --fig-h:clamp(52px,6vw,98px);     /* 人物の線画（脇役・小さく数多く） */
  --hang:clamp(22px,2.6vw,38px);    /* ざぶとんの下端から外へはみ出す量 */
}
.cushion{
  position:relative;z-index:1; /* 背面のマーガレット(.fb*)より前に置く */
  background:linear-gradient(100deg,var(--grad-l) 0%,var(--grad-c) 52%,var(--grad-r) 100%);
  border-radius:clamp(28px,3.4vw,48px);
  padding:clamp(46px,6vw,88px) clamp(24px,5vw,72px);
  /* 下端に並ぶ面々のぶんを空ける */
  padding-bottom:calc(var(--pio-h) + clamp(10px,1.6vw,24px));
  text-align:center;
}
.cushion > *{margin-left:auto;margin-right:auto}
/* width:100% だと内側幅を左右いっぱいまで埋めて突っ張るので、少し引く */
.logo{display:block;width:88%;max-width:820px;height:auto}

/* ---------- ざぶとん下端の人だかり ----------
   ぴおすんを中央に、来場者の線画を左右に並べる。
   高さで揃えているので、各画像の縦横比は問わない。 */
.crowd{
  position:absolute;left:0;right:0;bottom:calc(var(--hang) * -1);
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(4px,1.6vw,30px);
  pointer-events:none;
  z-index:3; /* 花より前。人物が花に隠れないように */
}
/* 絵によって体型のデフォルメ具合が違い、同じ高さに揃えると頭身の低いものだけ
   大きく見える。--s で個別に倍率をかけて、見た目の背丈を揃える。 */
.crowd img{display:block;width:auto;height:calc(var(--fig-h) * var(--s,1))}
/* 隣の mamatoko の子供と頭の高さを合わせた値。
   両画像の「頭のてっぺんが画像高さの何%か」を実測して算出している
   （mamatoko の子供 47.8% / chibicos の医師 35.3% → 下端を揃えると 0.81）。
   絵の枠の高さで揃えても、腕や聴診器を上げているぶん頭の位置はズレる。 */
.crowd .s-chibicos{--s:.81}
.crowd .piosun{
  height:var(--pio-h);
  filter:drop-shadow(0 8px 14px rgba(48,78,76,.18));
}
/* 狭い画面では並べきれないので人数を減らす */
@media (max-width:560px){
  .crowd .fig-extra{display:none}
}

/* ---------- マーガレット ----------
   2026のメインビジュアルと同じ使い方。あえて画面の外へ切って奥行きを出す。
   奥行きは不透明度ではなく、ざぶとんの手前か背面かの前後関係で作っている。 */
.flower{position:absolute;pointer-events:none;height:auto;z-index:2}
/* 手前は角に3輪だけ。かつては薄い2輪を中腹に置いて奥行きを作っていたが、
   背面の大輪がその役を引き継いだので廃止した（同じ側に花が寄って団子になる） */
.f1{width:clamp(96px,13vw,210px);top:-6%;left:-7%;transform:rotate(-8deg)}
.f2{width:clamp(72px,9vw,150px);top:14%;right:-6%;transform:rotate(14deg)}
.f5{width:clamp(88px,11vw,180px);bottom:-9%;left:-5%;transform:rotate(-18deg)}

/* ざぶとんの背面から両端に覗く大輪。手前の3輪が角にいるので中腹に置く。
   はみ出す量は自分の幅を基準に計算する（画面幅の%でやると花の大きさと
   ずれて比率が崩れる）。58%出すと花の中心＝黄色い芯がざぶとんの外に来て、
   花だと分かる。これ以下だと白い花びらしか見えず、ただの塊に見える。 */
.fb{z-index:0}
/* 上辺・下辺からは覗かせない（上は間延びして見え、下は人だかりと競合する）。
   左右にだけ、高さをばらして並べる。 */
.fb1{--w:clamp(110px,17vw,300px);width:var(--w);top:34%;left:calc(var(--w) * -.58);transform:rotate(-14deg)}
.fb2{--w:clamp(120px,18vw,320px);width:var(--w);top:50%;right:calc(var(--w) * -.58);transform:rotate(20deg)}
.fb3{--w:clamp(84px,12vw,210px);width:var(--w);top:68%;left:calc(var(--w) * -.58);transform:rotate(26deg)}
.fb4{--w:clamp(92px,13vw,230px);width:var(--w);top:16%;right:calc(var(--w) * -.58);transform:rotate(-22deg)}

/* ざぶとんの中に置く小花。
   .cushion が z-index で積み重ねの文脈を作っているので、z-index:-1 にすると
   グラデの上・文字の下に入る。かぶっても文章の読みやすさを壊さない。
   位置は文字の最大幅の外側（ボタンの高さあたりは左右に余裕がある）。 */
.cushion > .fs{
  position:absolute;margin:0;z-index:-1;
  height:auto;pointer-events:none;
}
.fs1{width:clamp(44px,5vw,86px);top:62%;left:4%;transform:rotate(-16deg)}
.fs2{width:clamp(38px,4.4vw,74px);top:74%;right:5%;transform:rotate(22deg)}

@media (max-width:560px){
  /* 狭い画面は人が横幅いっぱいに並び左下に空きコーナーが無いので、左下を落とす */
  .f5{display:none}
  /* 文字が横幅いっぱいまで伸びて中の小花を置く余白が無くなるため落とす */
  .fs1,.fs2{display:none}
}

/* ---------- ざぶとんの中身 ---------- */
/* 日付はロゴの真下。2025の hero と同じ並びで、書体は丸ゴシック */
.date{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;
  margin:clamp(14px,2vw,22px) 0 0;color:var(--accent);
  font-size:clamp(28px,5.8vw,50px);line-height:1.3;letter-spacing:.01em;
}
.venue{margin:clamp(16px,2vw,24px) 0 0;font-size:clamp(18px,3.8vw,26px);line-height:1.5}
.venue small{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}
/* キャッチ＝一番言いたいこと。2025サイトで日付の下にタグラインが入っていた位置 */
.catch{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;
  margin:clamp(26px,3.2vw,40px) auto 0;max-width:26em;
  /* 下限を20pxにすると狭い画面で「おこたえし／て、」と割れるため17pxまで下げる */
  font-size:clamp(17px,3.4vw,32px);line-height:1.6;
}
/* 2行を意図した割り方で固定する（自然折り返しだと語の途中で割れる） */
.catch span,.catch em{display:block}
.catch em{font-style:normal;color:var(--accent)}
.lead{margin:clamp(14px,1.8vw,22px) auto 0;max-width:34em;font-size:clamp(15px,1.9vw,18px);line-height:1.95}

/* ---------- ボタン（2026実測：角丸16px・影なし・480×48 / 24px太字） ---------- */
.btn{
  display:block;width:100%;max-width:480px;
  margin:clamp(28px,3.6vw,42px) auto 0;
  padding:12px 24px;border-radius:16px;
  background:var(--accent);color:#fff;text-decoration:none;
  font-size:clamp(17px,4.6vw,24px);line-height:1.5;
  transition:background-color .15s ease;
}
.btn:hover,.btn:focus-visible{background:var(--accent-sh)}

/* バッジ。ロゴの「2027」と日付の「2027年」が隣り合って重複して見えるため、
   間に挟んで切り分ける役目も持たせている。
   コーラルの角丸箱にするとCTAボタンと同じ形・同じ色になり、押せるものと
   押せないものの区別がつかなくなるため、箱を持たせず文字だけで見出しにする。
   左右の罫線は「ラベルである」ことを形で示すためのもの */
.badge{
  display:flex;align-items:center;gap:clamp(12px,1.6vw,20px);
  width:fit-content;
  margin:clamp(20px,2.6vw,32px) auto 0;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;color:var(--ink);
  font-size:clamp(16px,2.2vw,23px);letter-spacing:.14em;
}
.badge::before,.badge::after{
  content:"";display:block;
  width:clamp(20px,3vw,40px);height:3px;border-radius:2px;
  background:var(--accent);
}

/* ---------- フッター ---------- */
footer{margin-top:0;padding:34px 20px 48px;text-align:center;font-size:13px;color:var(--ink-soft)}
.sns{display:flex;gap:14px;justify-content:center;margin:0 0 20px;padding:0;list-style:none}
/* ざぶとんのグラデを2つに分け持ちする。
   X が 青緑→黄色、Instagram が 黄色→コーラル。並ぶと上のグラデ全体になり、
   フッターがメインビジュアルと色でつながる。
   文字色はコーラルだとコーラル寄りの地に埋もれるので本文と同じ深緑にする。 */
/* 白枠で縁取る。グラデの黄色寄りの端がクリーム地に溶けて輪郭が消えるため、
   枠でチップとして立たせる */
.sns a{
  width:56px;height:56px;border-radius:16px;
  border:4px solid #fff;
  color:var(--ink);
  display:grid;place-items:center;text-decoration:none;
}
.sns .x{background:linear-gradient(100deg,var(--grad-l),var(--grad-c))}
.sns .ig{background:linear-gradient(100deg,var(--grad-c),var(--grad-r))}
.sns svg{width:20px;height:20px;fill:currentColor}
footer p{margin:4px 0}
footer a.txt{color:var(--accent)}
</style>
</head>
<body>

<div class="iconband iconband--top" role="presentation"></div>

<main class="mv">
  <div class="cushion">
    <img class="logo" src="img/logo-2027.png" alt="医療×ざっかふぇす 2027" width="1855" height="545">

    <p class="venue">
      都立産業貿易センター 台東館 4階
      <small>〒111-0033 東京都台東区花川戸2-6-5</small>
    </p>

    <!-- 会場面積の推移：第1回 約100㎡ → 第2回 約200㎡ → 第3回 1400㎡。
         来場2000人以上想定・70サークル出展目標。ただし数字はサイトに出さない方針
         （えのもとさん・2026/9/9）。想定値・目標値であって実績ではないため、
         規模は言葉で伝える。
         「これまでにない」等の最上級は、2回しか実績がないのに歴史を盛って
         聞こえるため使わない -->
    <p class="catch"><span>過去2回の大盛況におこたえして、</span><em>会場がぐんと広くなりました！</em></p>

    <p class="lead">医療をテーマに、個性豊かな雑貨やアクセサリーが大集合するクリエイティブマーケット。</p>

    <a class="btn" href="https://x.com/iryozakka/" target="_blank" rel="noopener">続報を X で受け取る</a>

    <img class="fs fs1" src="img/art/margaret-white.png" alt="" aria-hidden="true">
    <img class="fs fs2" src="img/art/margaret-orange.png" alt="" aria-hidden="true">
  </div>
  <!-- 線画の色でグラデ上の並び順を決めている。
       左（ミント #9de5e0）にコーラルの線画、右（コーラルパステル #ffbdb5）に
       深緑の線画を置くと、どちらの側でも線が背景に埋もれない。
       中央のぴおすんは白基調なので黄色（#fbf4d0）の上に来るようにする。
       並べ替えるときはこの対応を崩さないこと。 -->
  <div class="crowd" aria-hidden="true">
    <img class="fig-extra" src="img/art/helpmark.png" alt="">
    <img src="img/art/mamatoko.png" alt="">
    <img class="s-chibicos" src="img/art/chibicos.png" alt="">
    <img class="piosun" src="img/piosun.png" alt="マスコットのぴおすん">
    <img src="img/art/hiyorinmioshin.png" alt="">
    <img src="img/art/pregnant-pair.png" alt="">
    <img class="fig-extra" src="img/art/n-doc.png" alt="">
  </div>

  <img class="flower fb fb1" src="img/art/margaret-white.png" alt="" aria-hidden="true">
  <img class="flower fb fb2" src="img/art/margaret-orange.png" alt="" aria-hidden="true">
  <img class="flower fb fb3" src="img/art/margaret-orange.png" alt="" aria-hidden="true">
  <img class="flower fb fb4" src="img/art/margaret-white.png" alt="" aria-hidden="true">

  <img class="flower f1" src="img/art/margaret-orange.png" alt="" aria-hidden="true">
  <img class="flower f2" src="img/art/margaret-white.png" alt="" aria-hidden="true">
  <img class="flower f5" src="img/art/margaret-white.png" alt="" aria-hidden="true">
</main>

<footer>
  <ul class="sns">
    <li><a href="https://x.com/iryozakka/" target="_blank" rel="noopener" class="x" aria-label="X（旧Twitter）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.3l-4.9-6.4L6.1 22H3l7.2-8.3L2.3 2h6.4l4.6 6L18.9 2Zm-1.1 18h1.7L7.4 3.8H5.6L17.8 20Z"/></svg>
