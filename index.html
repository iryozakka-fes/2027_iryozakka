<style>
/* =========================================================
   医療×ざっかふぇす 2027 ティザー
   カラーは Notion「世界観・トンマナ決定」(2026/09/01確定) に準拠
   ルール: ページ背景は単色。グラデはメインビジュアル（ざぶとん）限定
   角丸は2026サイトの実測スケールに合わせる: ラベル4px / 小ボタン8px / 主ボタン16px
   ========================================================= */
:root{
  --bg:        #fbf4d0; /* 背景 パステルイエロー・単色 */
  --teal:      #36cac2; /* ロゴ青緑 固定 */
  --accent:    #ff7d6d; /* アクセント */
  --accent-sh: #e8655a; /* アクセントの影（hover用・派生色） */
  --ink:       #304e4c; /* フォント色 */
  --ink-soft:  #5c7a77; /* 補助文字（--ink の明度を上げた派生色） */
  --grad-l:    #9de5e0; /* ざぶとん左端 青緑パステル */
  --grad-c:    #fbf4d0; /* ざぶとん中間 = 背景色 */
  --grad-r:    #ffbdb5; /* ざぶとん右端 コーラルパステル */
  --gutter:    clamp(40px,6vw,72px); /* ざぶとんの上下に残す余白 */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic Medium","游ゴシック Medium",YuGothic,
              游ゴシック体,"ヒラギノ角ゴ Pro W3",メイリオ,sans-serif;
  font-weight:700;
  line-height:1.75;
}
img{max-width:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}


/* ---------- グラデのざぶとん ----------
   ヘッダー・フッター以外＝コンテンツ全部がこの上に乗る。
   .wrap の860px制限の外に出して、画面幅の88%まで広げている。 */
.mv{
  position:relative;
  width:min(88vw,1240px);
  margin:var(--gutter) auto 0;
  /* ぴおすんの表示幅。ざぶとんの下余白をこの値から計算するので、
     ここだけ変えれば中身と被らないまま大きさを調整できる */
  --pio:clamp(120px,13vw,210px);
}
.cushion{
  background:linear-gradient(100deg,var(--grad-l) 0%,var(--grad-c) 52%,var(--grad-r) 100%);
  border-radius:clamp(28px,3.4vw,48px);
  padding:clamp(38px,5vw,76px) clamp(24px,5vw,72px);
  /* 下端中央に立つぴおすんのぶんを空ける（ぴおすんの実寸比 1163:1797 ＝ 高さは幅の約1.55倍） */
  padding-bottom:calc(var(--pio) + clamp(20px,3vw,44px));
  text-align:center;
}
.cushion > *{margin-left:auto;margin-right:auto}
.logo{display:block;width:100%;max-width:820px;height:auto}
/* 2025・2026どちらも中央の縦積みで、マスコットを横に並べる作りではない。
   ぴおすんはざぶとん下端の中央に立たせ、どの画面幅でも横並びにしない */
.piosun{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--pio) * -0.55);
  width:var(--pio);height:auto;
  filter:drop-shadow(0 8px 14px rgba(48,78,76,.18));
}

/* ---------- ざぶとんの中身 ---------- */
/* 日付はロゴの真下。2025の hero と同じ並びで、書体は丸ゴシック */
.date{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;
  margin:clamp(14px,2vw,22px) 0 0;color:var(--accent);
  font-size:clamp(28px,5.8vw,50px);line-height:1.3;letter-spacing:.01em;
}
.venue{margin:clamp(16px,2vw,24px) 0 0;font-size:clamp(18px,3.8vw,26px);line-height:1.5}
.venue small{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}
/* キャッチ＝一番言いたいこと。2025サイトで日付の下にタグラインが入っていた位置 */
.catch{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;
  margin:clamp(26px,3.2vw,40px) auto 0;max-width:26em;
  font-size:clamp(20px,3.2vw,32px);line-height:1.6;
}
/* 2行を意図した割り方で固定する（自然折り返しだと語の途中で割れる） */
.catch span,.catch em{display:block}
.catch em{font-style:normal;color:var(--accent)}
.lead{margin:clamp(14px,1.8vw,22px) auto 0;max-width:34em;font-size:clamp(15px,1.9vw,18px);line-height:1.95}

/* ---------- ボタン（2026実測：角丸16px・影なし・480×48 / 24px太字） ---------- */
.btn{
  display:block;width:100%;max-width:480px;
  margin:clamp(28px,3.6vw,42px) auto 0;
  padding:12px 24px;border-radius:16px;
  background:var(--accent);color:#fff;text-decoration:none;
  font-size:clamp(17px,4.6vw,24px);line-height:1.5;
  transition:background-color .15s ease;
}
.btn:hover,.btn:focus-visible{background:var(--accent-sh)}

/* バッジ。ロゴの「2027」と日付の「2027年」が隣り合って重複して見えるため、
   間に挟んで切り分ける役目も持たせている */
.badge{
  display:inline-block;
  margin:clamp(18px,2.4vw,30px) auto 0;
  background:var(--accent);color:#fff;
  padding:clamp(10px,1.3vw,15px) clamp(24px,3.4vw,40px);border-radius:16px;
  font-size:clamp(17px,2.4vw,24px);letter-spacing:.12em;
}

/* ---------- フッター ---------- */
footer{margin-top:var(--gutter);padding:34px 20px 48px;text-align:center;font-size:13px;color:var(--ink-soft)}
.sns{display:flex;gap:14px;justify-content:center;margin:0 0 20px;padding:0;list-style:none}
.sns a{
  width:48px;height:48px;border-radius:16px;
  background:#fff;color:var(--accent);
  display:grid;place-items:center;text-decoration:none;
}
.sns svg{width:20px;height:20px;fill:currentColor}
footer p{margin:4px 0}
footer a.txt{color:var(--accent)}
</style>
</head>
